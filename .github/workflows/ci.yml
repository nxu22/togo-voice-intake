name: CI

# Unit tests only. Nothing here talks to Anthropic, Deepgram, Cartesia, LiveKit or
# n8n, so the job needs no secrets — see the "no secrets" note below before adding
# any step that would change that.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 3.12 matches the Dockerfile's ARG PYTHON_VERSION, so CI runs the interpreter
      # the worker actually deploys on.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        # requirements.txt already pins pytest and pytest-asyncio under its "# dev"
        # section; naming pytest again keeps the suite runnable if those ever move
        # out of requirements.txt.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # pyproject's testpaths = ["tests"] confines collection to tests/, which keeps
      # scripts/simulate_call.py out of CI — it places a real, billable Anthropic call.
      - name: Run tests
        run: pytest
